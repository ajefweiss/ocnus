[package]
name = "ocnus-py"
version = "0.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ocnus_py"
crate-type = ["cdylib"]

[dependencies]
nalgebra = { version = "0.34.2", features = ["rayon", "serde-serialize"] }
numpy = "0.28.0"
paste = "1.0.15"
pyo3 = "0.28.3"
pyo3-log = "0.13.3"

bayesfm = { path = "/Users/ajweiss/Projects/bayesfm-rs", features = ["pyo3"] }
prodef = { path = "/Users/ajweiss/Projects/prodef-rs", features = ["pyo3"] }
ocnus = { path = "/Users/ajweiss/Projects/ocnus-rs" }

[features]
f32 = []
