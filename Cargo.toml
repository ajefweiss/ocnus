[workspace]
members = [
    "crates/*",
]
resolver = "3"

[workspace.package]
authors = ["Andreas J. Weiss <ajefweiss@gmail.com>"]
edition = "2024"
license = "MIT License"
repository = "https://github.com/ajefweiss/ocnus/"
rust-version = "1.92"

[workspace.dependencies]
approx = "*"
chrono = "*"
criterion = "*"
derive_builder = "*"
derive_more = { version = "*", features = ["full"] }
dtw = "*"
env_logger = "*"
itertools = "*"
log = "*"
nalgebra = { version = "*", features = ["rayon", "serde-serialize"] }
num-traits = "*"
paste = "*"
rand = "*"
rand_distr = "*"
rand_xoshiro = "*"
rayon = "*"
serde = { version = "*", features = ["derive"] }
serde_arrays = "*"
serde_json5 = "*"
typenum = "*"
thiserror = "*"
wcs = "*"

ocnus = { path = "./crates/ocnus", version = "0.0.0" }
ocnus-frm = { path = "./crates/ocnus-frm", version = "0.0.0" }
ocnus-geo = { path = "./crates/ocnus-geo", version = "0.0.0" }
ocnus-swm = { path = "./crates/ocnus-swm", version = "0.0.0" }
prodef = { path = "/Users/ajweiss/Projects/prodef-rs" }



[profile.bench]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3

[profile.test]
opt-level = 1

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
